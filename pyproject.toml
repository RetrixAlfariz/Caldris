[project]
name = "caldris"
version = "0.1.1"
description = "Semantic handwritten computation prototype for mathematics and engineering"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "antlr4-python3-runtime==4.11.*",
    "fastapi>=0.116,<1",
    "python-multipart>=0.0.20,<1",
    "sympy>=1.14,<2",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
ocr = [
    "numpy>=1.26,<3",
    "paddleocr>=3.3,<4",
    "pillow>=10,<13",
]
ocr-texteller = [
    "texteller",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
